<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Podcasts — Resona</title>
    <meta name="description" content="Browse and replay your previously generated podcasts on Resona.">
    <link rel="stylesheet" href="previous.css">
</head>
<body>
    <div class="main">
        <div class="left-container">
            <a href="previous.html"><img src="Images/library.svg" alt="Library" id="navLibrary"></a>
            <a href="setting.html"><img src="Images/Settings.svg" alt="Settings"></a>
        </div>

        <div class="right-container">
            <div class="header">
                <a href="studio.html" class="logo"></a>
                <a href="hero.html" class="exit">
                    <p style="display:inline-block;color:rgb(155,155,155);font-size:16px;font-weight:500;font-family:Average Sans;text-decoration:none;">Exit Studio</p>
                </a>
            </div>

            <div class="main-content">
                <h2>My Podcasts</h2>
                <p class="subtitle" id="loadingMsg">Loading your podcasts…</p>

                <!-- List of past podcast cards -->
                <div id="podcastList" class="podcast-list"></div>

                <!-- Empty state -->
                <div id="emptyState" class="empty-state" style="display:none;">
                    <div class="empty-icon">🎙️</div>
                    <p class="empty-title">No podcasts yet</p>
                    <p class="empty-sub">Head to the studio and generate your first one!</p>
                    <a href="studio.html" class="cta-btn">Open Studio</a>
                </div>
            </div>

            <!-- Detail panel — slides in when a card is clicked -->
            <div id="detailPanel" class="detail-panel" style="display:none;">
                <div class="detail-header">
                    <button id="detailBack" class="back-btn">← Back</button>
                    <h3 id="detailTitle" class="detail-title"></h3>
                </div>

                <div class="detail-meta" id="detailMeta"></div>

                <!-- Transcript replay -->
                <div class="detail-cols">
                    <div class="detail-transcript-wrap">
                        <p class="section-label">Transcript</p>
                        <div id="detailTranscript" class="detail-transcript"></div>
                    </div>

                    <div class="detail-audio-wrap">
                        <p class="section-label">Audio</p>
                        <audio id="detailAudio" controls style="width:100%;margin-top:8px;"></audio>
                        <p id="detailAudioInfo" class="audio-info">Select a turn to hear it.</p>

                        <div class="detail-downloads" id="detailDownloads" style="display:none;">
                            <a id="detailScriptDl" class="dl-btn" href="#" download>⬇ Script</a>
                            <a id="detailAudioDl"  class="dl-btn" href="#" download>⬇ Full Audio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="previous.js"></script>
</body>
</html>
